name: CI
on:
  push: {branches: [master]}
  pull_request:
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: worker}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov=rater --cov-report=term-missing
      - name: Eval summary (committed results; recordings are never in CI)
        run: |
          shopt -s nullglob; for f in eval/results/*.json; do echo "## $f" >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; head -c 4000 "$f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; done
          [ -f ../docs/EVAL.md ] && cat ../docs/EVAL.md >> "$GITHUB_STEP_SUMMARY" || true
      - run: python -c "import modal_app" || true
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx next build
